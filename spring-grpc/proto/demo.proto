syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.halab4dev.grpc";
option java_outer_classname = "DemoProto";

package demo;

import "google/protobuf/empty.proto";

message GetDataRequest {
  string id = 1;
  int32 sizeBytes = 2;
}

message GetDataResponse {
  string id = 1;
  bytes payload = 2;
}

message CreatePostRequest {
  string content = 1;
}

message CreatePostResponse {
  string id = 1;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  string id = 1;
  string content = 2;
}

message DeletePostRequest {
  string id = 1;
}

service DemoService {
  rpc GetData(GetDataRequest) returns (GetDataResponse);

  rpc CreatePosts(stream CreatePostRequest) returns (stream CreatePostResponse);
  rpc ListPosts(google.protobuf.Empty) returns (stream GetPostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc DeletePosts(stream DeletePostRequest) returns(google.protobuf.Empty);
}

